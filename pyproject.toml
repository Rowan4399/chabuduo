[project]
name = "chabuduo"
version = "0.1.0"
description = "A small, reproducible aircraft trajectory generation benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "lightning>=2.5",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=18",
  "pyproj>=3.7",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "torch==2.5.1; sys_platform != 'win32'",
  "torch==2.7.1; sys_platform == 'win32'",
  "traffic>=2.13",
  "typer>=0.15",
]

[project.scripts]
chabuduo = "chabuduo.cli:app"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
traffic = { git = "https://github.com/xoolive/traffic.git", branch = "prepare-v3" }
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chabuduo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
