name: zurich_rwy14_ddpm_unconditional
dataset: zurich
version: v1
source:
  type: traffic_dataset
  dataset: landing_zurich_2019
  filename: landing_zurich_2019.parquet
preprocess:
  operation: landing
  airport: LSZH
  runways:
  - '14'
  radius_nm: 40
  max_threshold_distance_nm: 0.1
  min_observations: 10
  min_duration_sec: 600
prepare:
  points: 200
  metadata_columns:
  - runway
  - initial_flow
  - simple
  representation:
    name: kinematic_200
    features:
    - track_unwrapped
    - groundspeed_kt
    - altitude_ft
    - elapsed_time_sec
    units:
    - degree
    - knot
    - ft
    - s
    direction: chronological
    anchor: runway_threshold
  split:
    group_by: flight_id
    train: 0.7
    validation: 0.15
    test: 0.15
    seed: 42
  normalization:
    method: standard_per_timestep
    fit_on: train
model:
  type: ddpm
  architecture: temporal_dilated_resnet
  hidden_channels: 128
  residual_blocks: 6
  kernel_size: 3
  dilations:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  dropout: 0.1
  use_phase: true
  time_embedding_dim: 128
  diffusion_steps: 1000
  beta_schedule: linear
  prediction: noise
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_step_size: 200
  lr_gamma: 0.5
training:
  seed: 42
  batch_size: 32
  max_epochs: 500
  num_workers: 0
  accelerator: auto
  devices: 1
  gradient_clip_norm: 1.0
  mixed_precision: true
  ema_decay: 0.999
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
sampling:
  type: ddpm
  count: 100
  seed: 42
  steps: 100
  eta: 0.0
  minimum_groundspeed_kt: 30.0
  maximum_groundspeed_kt: 600.0
  minimum_altitude_ft: -1000.0
  maximum_altitude_ft: 45000.0
