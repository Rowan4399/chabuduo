name: tianjin_16lr_cddpm
dataset: tianjin
version: v1
source:
  type: local_parquet
  filename: zbtj-rwy16lr-landing-60nm-noaib-no-linear300s-track-terminal-fixed200-v1.parquet
preprocess:
  operation: landing
  airport: ZBTJ
  runways:
  - 16L
  - 16R
  radius_nm: 60
  max_threshold_distance_nm: 0.1
  min_observations: 10
  min_duration_sec: 600
prepare:
  points: 200
  metadata_columns:
  - runway
  representation:
    name: kinematic_200
    features:
    - track_unwrapped
    - groundspeed_kt
    - altitude_ft
    - elapsed_time_sec
    units:
    - degree
    - knot
    - ft
    - s
    direction: chronological
    anchor: runway_threshold
  split:
    group_by: flight_id
    train: 0.7
    validation: 0.15
    test: 0.15
    seed: 42
    stratify_by: runway
  normalization:
    method: standard_per_timestep
    fit_on: train
  artifact: data/processed/tianjin_16lr_conditional_terminal200-v1
  resample: false
  terminal_track_branch: true
model:
  type: ddpm
  architecture: temporal_dilated_resnet
  hidden_channels: 128
  residual_blocks: 6
  kernel_size: 3
  dilations:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  dropout: 0.1
  use_phase: true
  time_embedding_dim: 128
  diffusion_steps: 1000
  beta_schedule: linear
  prediction: noise
  conditioning:
    feature: runway_id
    count: 2
    embedding_dim: 16
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_step_size: 100
  lr_gamma: 0.5
training:
  seed: 42
  batch_size: 32
  max_epochs: 700
  num_workers: 0
  accelerator: auto
  devices: 1
  gradient_clip_norm: 1.0
  mixed_precision: true
  ema_decay: 0.999
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
sampling:
  type: ddpm
  count: 1000
  seed: 42
  steps: 100
  eta: 0.0
  minimum_groundspeed_kt: 0.0
  maximum_groundspeed_kt: 600.0
  minimum_altitude_ft: -1000.0
  maximum_altitude_ft: 60000.0
  conditions:
  - 0
  - 1
