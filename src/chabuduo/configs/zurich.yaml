name: zurich
version: v1

source:
  type: traffic_dataset
  dataset: landing_zurich_2019
  filename: landing_zurich_2019.parquet

preprocess:
  operation: landing
  airport: LSZH
  radius_nm: 40
  max_threshold_distance_nm: 0.1
  min_observations: 10
  min_duration_sec: 600

prepare:
  points: 200
  representation:
    name: projected_position_200
    features: [east_m, north_m, altitude_m]
    units: [m, m, m]
    direction: chronological
    projection: airport_centered_aeqd
  split:
    group_by: flight_id
    train: 0.70
    validation: 0.15
    test: 0.15
    seed: 42
  normalization:
    method: standard_per_timestep
    fit_on: train
